# =====================================================================
# PaoPao Gateway seed configuration
#
# This is the only file you need to edit. After editing, re-pack the
# seed ISO with make-seed.sh (see docs/customize.md).
# Shell syntax: key="value". Everything commented out = default.
# =====================================================================

# --- Login -----------------------------------------------------------
# SSH accepts public-key authentication only. Fill in your key to
# enable SSH login for user "ubuntu":
#ssh_authorized_key="ssh-ed25519 AAAA...your-key... you@host"

# Console (VM display) password for user "ubuntu".
# If neither a key nor a password is set, the console password defaults
# to "paopao" and you are forced to change it on first login.
#password=""

# --- System ----------------------------------------------------------
#hostname="PaoPaoGW"

# --- Network (default: DHCP on every ethernet port) -------------------
#net_mode="static"
#static_ip="192.168.1.10/24"
#static_gateway="192.168.1.1"
#static_dns="192.168.1.1 223.5.5.5"

# --- Gateway config (/www/ppgw.ini) -----------------------------------
# If PaoPaoDNS runs on your LAN, leave every ini_* line commented: the
# gateway discovers its config from http://paopao.dns:7889 on its own.
# Otherwise, any uncommented ini_* key is written to /www/ppgw.ini with
# the prefix stripped. Full parameter reference: docs/reference.md
#ini_mode="suburl"
#ini_suburl="https://example.com/your-subscription"
#ini_subtime="1d"
#ini_fake_cidr="7.0.0.0/8"
#ini_dns_ip="223.5.5.5"
#ini_dns_port="53"
#ini_clash_web_port="80"
#ini_clash_web_password="CHANGE_ME"
#ini_udp_enable="no"
#ini_sleeptime="30"
#ini_fast_node="yes"
#ini_test_node_url="https://www.youtube.com/generate_204"
