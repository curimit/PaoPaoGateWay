# The tproxy policy routing rule (fwmark 1 -> table 100) and the
# table-100 local route are added at runtime by ppg.sh. With networkd's
# defaults (ManageForeignRoutingPolicyRules=yes), any link reconfigure
# (DHCP lease change, netplan apply) silently deletes the fwmark rule,
# which kills all proxied LAN traffic while the dashboard keeps working.
# Tell networkd to leave rules/routes it did not create alone.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
