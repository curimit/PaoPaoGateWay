# PaoPao Gateway defaults.
# The gateway works as a transparent proxy via nftables tproxy:
# ip_forward stays off on purpose (traffic is intercepted, not routed),
# route_localnet is required for the fake-ping DNAT to 127.0.0.1.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.route_localnet = 1
# IPv4-only by default, same as the ISO edition.
# To enable IPv6, remove the two lines below and create the flag file
# /etc/ppgw/ipv6_enabled (see README).
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
