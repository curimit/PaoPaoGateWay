name: Build and Release seed ISO + offline bundle

on:
  workflow_dispatch:
  push:
    branches: [main, cloud-init]
    paths:
      - 'pkg/**'
      - 'ppgw.conf'
      - 'user-data.yaml'
      - 'install.sh'
      - 'build-debs.sh'
      - 'build-bundle.sh'
      - 'make-seed.sh'
      - 'ppgw/ppgw.go'
      - '.github/workflows/release-cloudinit.yml'
permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@main
    - name: Install xorriso
      run: sudo apt-get update -q && sudo apt-get install -y -q xorriso
    - name: Set SHSHA
      run: echo "SHSHA="$(echo "${{ github.sha }}"|grep -Eo "^[0-9a-z]{7}"|head -1) >> $GITHUB_ENV
    - name: Set TAG_NAME
      run: echo "TAG_NAME=cloudinit-""$(date +%Y%m%d)"""-"${{ env.SHSHA }}" >> $GITHUB_ENV
    - name: Build seed ISO and offline bundle
      run: bash build-bundle.sh
    - name: Set release note
      run: echo "RE_NOTE=mihomo $(cat dist/mihomo_version.txt) / $(head -1 dist/sha256sum.txt)" >> $GITHUB_ENV
    - name: Upload files to GitHub release
      uses: svenstaro/upload-release-action@master
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file_glob: true
        file: dist/*
        tag: ${{ env.TAG_NAME }}
        body: ${{ env.RE_NOTE }}
        make_latest: true
    - name: Remove old release
      uses: dev-drprasad/delete-older-releases@v0.3.2
      with:
        keep_latest: 30
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
