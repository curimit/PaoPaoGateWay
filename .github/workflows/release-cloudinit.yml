name: Build and Release cloud-init payload

on:
  workflow_dispatch:
  push:
    branches: [main, cloud-init]
    paths:
      - 'files/**'
      - 'install.sh'
      - 'user-data.yaml'
      - 'build-payload.sh'
      - 'ppgw/ppgw.go'
      - '.github/workflows/release-cloudinit.yml'
permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@main
    - name: Set SHSHA
      run: echo "SHSHA="$(echo "${{ github.sha }}"|grep -Eo "^[0-9a-z]{7}"|head -1) >> $GITHUB_ENV
    - name: Set TAG_NAME
      run: echo "TAG_NAME=cloudinit-""$(date +%Y%m%d)"""-"${{ env.SHSHA }}" >> $GITHUB_ENV
    - name: Build payload
      run: bash build-payload.sh
    - name: Collect release assets
      run: |
        cp install.sh user-data.yaml dist/
        cd dist
        sha256sum install.sh user-data.yaml >>payload.tar.gz.sha256
        mv payload.tar.gz.sha256 sha256sum.txt
        cp sha256sum.txt payload.tar.gz.sha256
        echo "RE_NOTE=mihomo $(cat mihomo_version.txt) / payload sha256 $(head -1 sha256sum.txt | cut -d' ' -f1)" >> $GITHUB_ENV
    - name: Upload files to GitHub release
      uses: svenstaro/upload-release-action@master
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file_glob: true
        file: dist/*
        tag: ${{ env.TAG_NAME }}
        body: ${{ env.RE_NOTE }}
        make_latest: true
    - name: Remove old release
      uses: dev-drprasad/delete-older-releases@v0.3.2
      with:
        keep_latest: 30
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
