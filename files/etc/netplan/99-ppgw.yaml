# PaoPao Gateway network configuration.
# DHCP on every ethernet port: plug the LAN cable into any NIC and the
# runtime picks the interface holding the default route automatically.
# For a static address, replace this with a per-interface definition.
network:
  version: 2
  ethernets:
    all-ethernets:
      match:
        name: "e*"
      dhcp4: true
      link-local: []
