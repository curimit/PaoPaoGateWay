#cloud-config
# PaoPao Gateway seed - static user-data.
#
# Do NOT edit this file: it is identical on every seed and carries no
# per-deployment logic. All customization lives in ppgw.conf, which
# make-seed.sh compiles into the ppgw-config deb on the seed ISO.

hostname: PaoPaoGW
timezone: Asia/Shanghai
manage_etc_hosts: false

runcmd:
  - |
    set -x
    dev="$(blkid -L cidata 2>/dev/null || blkid -L CIDATA 2>/dev/null)"
    [ -n "$dev" ] || exit 1
    mkdir -p /run/ppgw-seed
    mount -o ro "$dev" /run/ppgw-seed
    export DEBIAN_FRONTEND=noninteractive
    apt-get install -y --no-install-recommends /run/ppgw-seed/debs/*.deb \
        && touch /var/lib/ppgw-installed
    umount /run/ppgw-seed
  - |
    # Reboot once so netplan/sysctl/ppgw.service start from a clean state.
    [ -f /var/lib/ppgw-installed ] && reboot
